<main class="invite-page">
  <section class="invite-panel" aria-labelledby="invite-title">
    <div class="brand-mark" aria-hidden="true">RC</div>
    <p class="eyebrow">RECRUITMENT CRM</p>
    <ng-container *ngIf="token; else invalidInvitation">
      <ng-container *ngIf="!completed; else successView">
        <h1 id="invite-title">Set your password</h1>
        <p class="intro">Choose a password with at least 12 characters to activate your HR account.</p>
        <form (ngSubmit)="submit()">
          <label for="password">New password</label>
          <input id="password" name="password" type="password" [(ngModel)]="password" autocomplete="new-password" minlength="12" required />
          <label for="confirm-password">Confirm password</label>
          <input id="confirm-password" name="confirmPassword" type="password" [(ngModel)]="confirmPassword" autocomplete="new-password" minlength="12" required />
          <p *ngIf="error" class="error" role="alert">{{ error }}</p>
          <button type="submit" [disabled]="busy || password.length < 12 || !confirmPassword">{{ busy ? "Activating..." : "Activate account" }}</button>
        </form>
      </ng-container>
      <ng-template #successView>
        <h1 id="invite-title">Account activated</h1>
        <p class="intro">Your password is set. Sign in to open your HR workspace.</p>
        <button type="button" (click)="goToLogin()">Go to sign in</button>
      </ng-template>
    </ng-container>
    <ng-template #invalidInvitation>
      <h1 id="invite-title">Invitation link missing</h1>
      <p class="intro">Ask your Manager for a current invitation link.</p>
    </ng-template>
  </section>
</main>
