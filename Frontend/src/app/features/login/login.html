<main class="login-page">
  <section class="login-panel" aria-labelledby="login-title">
    <div class="brand-mark" aria-hidden="true">TM</div>
    <p class="eyebrow">TVK MANAGEMENT</p>
    <h1 id="login-title">Sign in</h1>
    <p class="intro">Use your assigned account to open your workspace.</p>

    <form (ngSubmit)="submit()" autocomplete="off">
      <label for="username">Login ID</label>
      <input
        id="username"
        name="username"
        [(ngModel)]="username"
        autocomplete="off"
        required
      />

      <label for="password">Password</label>
      <div class="password-field-group">
        <input
          id="password"
          name="password"
          [type]="showPassword ? 'text' : 'password'"
          [(ngModel)]="password"
          autocomplete="new-password"
          value=""
          required
        />
        <button
          type="button"
          class="toggle-password-btn"
          (click)="showPassword = !showPassword"
          [attr.aria-label]="showPassword ? 'Hide password' : 'Show password'"
          [title]="showPassword ? 'Hide password' : 'Show password'"
        >
          <svg *ngIf="showPassword" class="eye-svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"></path>
            <line x1="1" y1="1" x2="23" y2="23"></line>
          </svg>
          <svg *ngIf="!showPassword" class="eye-svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
            <circle cx="12" cy="12" r="3"></circle>
          </svg>
        </button>
      </div>

      <p *ngIf="error" class="error" role="alert">{{ error }}</p>

      <button type="submit" [disabled]="busy || !username.trim() || !password">
        {{ busy ? "Signing in..." : "Sign in" }}
      </button>
    </form>
  </section>
</main>
